name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # A PostgreSQL service container is required for the auth integration
    # tests, which run against a real database rather than a mock (see the
    # testing strategy in the README).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jambo
          POSTGRES_PASSWORD: jambo
          POSTGRES_DB: jambo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://jambo:jambo@localhost:5432/jambo_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

      - run: npm run typecheck

      # `npm run typecheck` runs `tsc --noEmit` against each workspace's
      # full tsconfig (including tests); the production build uses a
      # narrower tsconfig.build.json (apps/api) and a real Vite bundle
      # (apps/web) — different enough that a passing typecheck doesn't
      # guarantee a passing build. This step actually produces the same
      # artifact Render and Vercel build from, so a real build failure
      # (like the Render deploy in the README's deployment architecture
      # section) would fail CI before it fails a live deploy.
      - run: npm run build --workspaces --if-present

      - name: Apply migrations to the test database
        run: npm run db:migrate:test -w @jambo/api

      - run: npm run test:coverage

      # Only Chromium — see e2e/playwright.config.ts for why one browser is
      # enough for a single happy-path suite. --with-deps installs the
      # system libraries Chromium needs on the bare ubuntu-latest runner.
      - name: Install Playwright's Chromium browser
        run: npx playwright install --with-deps chromium

      # GitHub Actions already sets CI=true on every runner, which
      # playwright.config.ts uses to enable retries and skip
      # reuseExistingServer — no extra env needed here.
      - name: Run E2E tests
        run: npm run e2e
